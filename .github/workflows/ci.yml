name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  # ============================================
  # STAP 1: Basis Setup
  # ============================================
  ci-pipeline:
    runs-on: ubuntu-latest
    name: CI Pipeline
    timeout-minutes: 30

    steps:
      # STAP 1.1: Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # STAP 1.2: Node.js setup (Backend)
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # STAP 1.3: Node.js setup (Frontend)
      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
