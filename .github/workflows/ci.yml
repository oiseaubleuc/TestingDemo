name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  # ============================================
  # Lint Job (Parallel)
  # ============================================
  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (backend)
        run: npm run lint || true
        continue-on-error: true

      - name: Check TypeScript errors
        run: npx tsc --noEmit

  # ============================================
  # Test Job (Parallel)
  # ============================================
  test:
    runs-on: ubuntu-latest
    name: Test
    timeout-minutes: 15

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --coverageReporters=text-summary
        env:
          RABBITMQ_URL: amqp://localhost:5672
          RABBITMQ_QUEUE: test_queue
          RABBITMQ_DLQ: test_dlq

  # ============================================
  # Build Job (Parallel)
  # ============================================
  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify build outputs
        run: |
          echo "Verifying build outputs..."
          test -d dist || (echo "❌ dist directory not found" && exit 1)
          test -f dist/api/server.js || (echo "❌ server.js not found" && exit 1)
          test -f dist/consumer/index.js || (echo "❌ consumer/index.js not found" && exit 1)
          echo "✅ Backend build verified"
          test -d frontend/dist || (echo "❌ frontend/dist not found" && exit 1)
          test -f frontend/dist/index.html || (echo "❌ index.html not found" && exit 1)
          echo "✅ Frontend build verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            frontend/dist/
          retention-days: 1

  # ============================================
  # Docker Build Job (Sequential - after parallel jobs)
  # ============================================
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: [lint, test, build]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: testingapp-app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify Docker image
        run: |
          echo "Verifying Docker image..."
          if docker images testingapp-app:ci-test --format "{{.Repository}}:{{.Tag}}" | grep -q "testingapp-app:ci-test"; then
            IMAGE_SIZE=$(docker images testingapp-app:ci-test --format "{{.Size}}")
            echo "✅ Docker image built successfully"
            echo "   Size: $IMAGE_SIZE"
          else
            echo "❌ Docker image not found"
            exit 1
          fi
