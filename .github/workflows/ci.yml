name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Lint & Test Job
  # ============================================
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter (backend)
        run: npm run lint || true

      - name: Run linter (frontend)
        run: |
          cd frontend
          npm run lint || true

      - name: Check for TypeScript errors
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend

      - name: Run tests
        run: npm test
        env:
          RABBITMQ_URL: amqp://localhost:5672
          RABBITMQ_QUEUE: test_queue
          RABBITMQ_DLQ: test_dlq

  # ============================================
  # Docker Build Job
  # ============================================
  build-docker-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================
  # Docker Compose Test Job
  # ============================================
  test-docker-compose:
    runs-on: ubuntu-latest
    needs: build-docker-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for testing
        run: |
          cat > .env << EOF
          RABBITMQ_URL=amqp://rabbitmq:5672/
          RABBITMQ_QUEUE=test_queue
          RABBITMQ_DLQ=test_dlq
          SALESFORCE_INSTANCE_URL=https://test.salesforce.com
          SALESFORCE_CLIENT_ID=test_client_id
          SALESFORCE_CLIENT_SECRET=test_client_secret
          SALESFORCE_REFRESH_TOKEN=test_refresh_token
          SALESFORCE_API_VERSION=v60.0
          API_PORT=3000
          FRONTEND_PORT=5173
          LOG_LEVEL=info
          EOF

      - name: Build Docker Compose services
        run: |
          docker-compose build --no-cache

      - name: Start services
        run: |
          docker-compose up -d

      - name: Wait for services to be healthy
        run: |
          timeout 60 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done'

      - name: Check API health
        run: |
          sleep 15
          curl -f http://localhost:3000/health || exit 1

      - name: Check Frontend
        run: |
          curl -f http://localhost:5173 || exit 1

      - name: Check RabbitMQ
        run: |
          curl -f http://localhost:15672 || exit 1

      - name: Stop services
        if: always()
        run: |
          docker-compose down -v
