name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  # ============================================
  # Build Job
  # ============================================
  build:
    runs-on: ubuntu-latest
    name: Build Project
    timeout-minutes: 30

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js (Backend)
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Setup Node.js (Frontend)
      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install backend dependencies
      - name: Install backend dependencies
        run: npm ci

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Build backend
      - name: Build backend
        run: npm run build

      # Build frontend
      - name: Build frontend
        run: npm run build:frontend

      # Verify build outputs
      - name: Verify build outputs
        run: |
          echo "Verifying build outputs..."
          test -d dist || (echo "❌ dist directory not found" && exit 1)
          test -f dist/api/server.js || (echo "❌ server.js not found" && exit 1)
          test -f dist/consumer/index.js || (echo "❌ consumer/index.js not found" && exit 1)
          echo "✅ Backend build verified"
          test -d frontend/dist || (echo "❌ frontend/dist not found" && exit 1)
          test -f frontend/dist/index.html || (echo "❌ index.html not found" && exit 1)
          echo "✅ Frontend build verified"

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            frontend/dist/
          retention-days: 1
